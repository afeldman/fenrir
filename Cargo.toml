[workspace]
resolver = "2"

members = [
    "fenrir-app",
    "crates/fenrir-core",
    "crates/fenrir-servo",
    "crates/fenrir-mcp",
    "crates/fenrir-network",
    "crates/fenrir-ai",
    "crates/fenrir-config",
    "crates/fenrir-log",
    "crates/fenrir-error-management",
    "crates/fenrir-i18n",
    "crates/fenrir-metrics",
    "crates/fenrir-rendering",
    "crates/fenrir-secure",
    "crates/fenrir-sandbox",
    "crates/fenrir-api",
    "crates/fenrir-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
authors = ["Fenrir Contributors"]
publish = false
rust-version = "1.86.0"

[workspace.dependencies]
# Internal crates
fenrir-core = { path = "crates/fenrir-core" }
fenrir-servo = { path = "crates/fenrir-servo" }
fenrir-mcp = { path = "crates/fenrir-mcp" }
fenrir-network = { path = "crates/fenrir-network" }
fenrir-ai = { path = "crates/fenrir-ai" }
fenrir-config = { path = "crates/fenrir-config" }
fenrir-log = { path = "crates/fenrir-log" }
fenrir-error-management = { path = "crates/fenrir-error-management" }
fenrir-i18n = { path = "crates/fenrir-i18n" }
fenrir-metrics = { path = "crates/fenrir-metrics" }
fenrir-rendering = { path = "crates/fenrir-rendering" }
fenrir-secure = { path = "crates/fenrir-secure" }
fenrir-sandbox = { path = "crates/fenrir-sandbox" }
fenrir-api = { path = "crates/fenrir-api" }
fenrir-ui = { path = "crates/fenrir-ui" }

# Async
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
logroller = "0.1"
once_cell = "1.20"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

# Zeroize for secrets
zeroize = { version = "1", features = ["derive"] }

# URLs
url = "2"

# Internationalization
fluent = "0.16"
fluent-bundle = { version = "0.15", features = ["unic-langid-ffi"] }
fluent-fallback = "0.7"
unic-langid = "0.9"

servo           = { git = "https://github.com/servo/servo", tag = "v0.0.5", package = "libservo", default-features = false, features = ["js_jit", "background_hang_monitor"] }
paint_api       = { git = "https://github.com/servo/servo", tag = "v0.0.5", package = "servo-paint-api" }
embedder_traits = { git = "https://github.com/servo/servo", tag = "v0.0.5", package = "servo-embedder-traits" }

# ── Local Servo development override ─────────────────────────────────────────
# To test IntersectionObserver fixes (or any upstream MR) in Fenrir before merge:
#
# 1. The servo git dep currently uses package = "libservo" (v0.0.5 name).
#    The local checkout (post-v0.0.5 main branch) uses package = "servo".
#    Either temporarily rename the local Cargo.toml package to "libservo", or
#    bump fenrir's dep to the next servo release which exposes "servo" as the name.
#

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
